version: 2
project_name: netprobe

dist: artifacts/dist

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: .
    ldflags:
      - -s -w -X github.com/potibm/netprobe/src/cmd.Version={{.Version}}

archives:
  - formats: tar.gz
    format_overrides:
      - goos: windows
        formats: zip
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

changelog:
  disable: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"
