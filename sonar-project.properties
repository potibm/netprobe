sonar.projectKey=potibm_netprobe
sonar.organization=potibm

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=netprobe

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.test.inclusions=**/*_test.go
sonar.coverage.exclusions=src/cmd/**,main.go

# Coverage Paths
sonar.go.coverage.reportPaths=artifacts/coverage/coverage.out